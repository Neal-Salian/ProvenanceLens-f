[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenancelens"
version = "0.1.0"
description = "Evidence-calibrated repair of direct model-lineage metadata in open model repositories"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Neal Salian" },
    { name = "Rusheel Sharma" },
    { name = "Veer Shetty" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "huggingface_hub>=0.23",
    "PyYAML>=6.0",
    "httpx>=0.23",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
# Phase E: LLM-last prose extraction. Never required by the deterministic core,
# and never includes a paid inference API. Ollama itself is an external
# runtime; ProvenanceLens never downloads a model.
llm = ["langchain-core>=1.0", "langchain-ollama>=0.3"]
# Phase G figures. Presentation only: every number a figure shows is also in the
# JSON/CSV artifacts, so the study itself runs without this extra.
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
# A small, coherent interface: audit one repository, see the demo, run the
# benchmark, reproduce the study. `python -m ...` equivalents keep working.
provenancelens = "provenancelens.cli:main"

[project.urls]
Documentation = "https://github.com/Rusheel86/ProvenanceLens#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
